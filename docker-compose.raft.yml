services:
  api:
    profiles: [single-api]

  raft-node-1: &raft-node
    build: .
    profiles: [raft]
    depends_on:
      postgres:
        condition: service_healthy
      redis-sentinel:
        condition: service_started
    environment: &raft-environment
      SAYANGCARE__POSTGRES__URL: postgres://sayangcare:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sayangcare
      SAYANGCARE__REDIS__SENTINEL_ENDPOINTS: '["redis-sentinel:26379"]'
      SAYANGCARE__REDIS__MASTER_NAME: sayangcare-master
      SAYANGCARE__REDIS__QUEUE_URL: redis://redis-master:6379/
      SAYANGCARE__TELEPHONY__TWILIO_ACCOUNT_SID: ${SAYANGCARE__TELEPHONY__TWILIO_ACCOUNT_SID:?Set SAYANGCARE__TELEPHONY__TWILIO_ACCOUNT_SID in .env}
      SAYANGCARE__TELEPHONY__TWILIO_AUTH_TOKEN: ${SAYANGCARE__TELEPHONY__TWILIO_AUTH_TOKEN:?Set SAYANGCARE__TELEPHONY__TWILIO_AUTH_TOKEN in .env}
      SAYANGCARE__QUEUE__BACKEND: redis
      SAYANGCARE__QUEUE__RAFT_ASSIGNMENTS: "true"
      SAYANGCARE__QUEUE__RAFT_NODE_ID: "1"
      SAYANGCARE__QUEUE__RAFT_PEERS: 1=http://raft-node-1:8080,2=http://raft-node-2:8080,3=http://raft-node-3:8080
      SAYANGCARE__QUEUE__RAFT_TOKEN: ${SAYANGCARE__QUEUE__RAFT_TOKEN:-local-raft-demo-token}
      SAYANGCARE__QUEUE__RAFT_DATA_DIR: /var/lib/sayangcare/raft
      SAYANGCARE__SERVER__HOST: 0.0.0.0
      SAYANGCARE__SERVER__PORT: 8080
    ports:
      - "18081:8080"
    volumes:
      - raft-node-1-data:/var/lib/sayangcare/raft
    restart: unless-stopped

  raft-node-2:
    <<: *raft-node
    environment:
      <<: *raft-environment
      SAYANGCARE__QUEUE__RAFT_NODE_ID: "2"
    ports:
      - "18082:8080"
    volumes:
      - raft-node-2-data:/var/lib/sayangcare/raft

  raft-node-3:
    <<: *raft-node
    environment:
      <<: *raft-environment
      SAYANGCARE__QUEUE__RAFT_NODE_ID: "3"
    ports:
      - "18083:8080"
    volumes:
      - raft-node-3-data:/var/lib/sayangcare/raft

volumes:
  raft-node-1-data:
  raft-node-2-data:
  raft-node-3-data:
