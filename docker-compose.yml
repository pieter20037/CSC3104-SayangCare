version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sayangcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sayangcare
    ports: ["${POSTGRES_PORT:-5434}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sayangcare"]
      interval: 5s
      retries: 10

  redis-master:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]

  redis-replica:
    image: redis:7-alpine
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    depends_on: [redis-master]

  redis-sentinel:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          'port 26379' \
          'sentinel resolve-hostnames yes' \
          'sentinel monitor sayangcare-master redis-master 6379 2' \
          'sentinel down-after-milliseconds sayangcare-master 5000' \
          'sentinel failover-timeout sayangcare-master 10000' \
          > /etc/sentinel.conf
        exec redis-sentinel /etc/sentinel.conf
    depends_on: [redis-master]
    ports: ["26379:26379"]

  api:
    build: .
    environment:
      SAYANGCARE__POSTGRES__URL: postgres://sayangcare:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sayangcare
      SAYANGCARE__REDIS__SENTINEL_ENDPOINTS: '["redis-sentinel:26379"]'
      SAYANGCARE__REDIS__MASTER_NAME: sayangcare-master
      SAYANGCARE__REDIS__QUEUE_URL: redis://redis-master:6379/
      SAYANGCARE__TELEPHONY__TWILIO_ACCOUNT_SID: ${SAYANGCARE__TELEPHONY__TWILIO_ACCOUNT_SID:?Set SAYANGCARE__TELEPHONY__TWILIO_ACCOUNT_SID in .env}
      SAYANGCARE__TELEPHONY__TWILIO_AUTH_TOKEN: ${SAYANGCARE__TELEPHONY__TWILIO_AUTH_TOKEN:?Set SAYANGCARE__TELEPHONY__TWILIO_AUTH_TOKEN in .env}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis-sentinel: { condition: service_started }

volumes:
  pgdata: