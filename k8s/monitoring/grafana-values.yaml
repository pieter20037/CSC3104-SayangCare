admin:
  existingSecret: grafana-admin

persistence:
  enabled: false

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Viewer
  users:
    viewers_can_edit: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: SayangCare
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    sayangcare-api:
      json: |
        {
          "id": null,
          "uid": "sayangcare-phase5",
          "title": "SayangCare API",
          "description": "API traffic, latency, session health, and replica availability.",
          "tags": ["SayangCare", "Observability"],
          "schemaVersion": 39,
          "version": 2,
          "refresh": "10s",
          "time": {
            "from": "now-30m",
            "to": "now"
          },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Request throughput",
              "description": "Total API requests per second across routes and replicas.",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
              "targets": [
                {
                  "expr": "sum(rate(sayangcare_http_requests_by_route_total[5m]))",
                  "legendFormat": "requests/s",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "min": 0,
                  "decimals": 2
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "showLegend": false
                },
                "tooltip": {
                  "mode": "single"
                }
              }
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "HTTP error rate",
              "description": "Share of requests returning 4xx or 5xx responses.",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
              "targets": [
                {
                  "expr": "100 * sum(rate(sayangcare_http_requests_by_route_total{status=~\"4..|5..\"}[5m])) / clamp_min(sum(rate(sayangcare_http_requests_by_route_total[5m])), 1e-9)",
                  "legendFormat": "error rate",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "min": 0,
                  "max": 100,
                  "decimals": 2
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "showLegend": false
                },
                "tooltip": {
                  "mode": "single"
                }
              }
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "HTTP latency percentiles",
              "description": "Overall p95 and p99 request duration across API routes and replicas.",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
              "targets": [
                {
                  "expr": "histogram_quantile(0.95, sum by (le) (rate(sayangcare_http_request_duration_by_route_seconds_bucket[5m])))",
                  "legendFormat": "p95",
                  "refId": "A"
                },
                {
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(sayangcare_http_request_duration_by_route_seconds_bucket[5m])))",
                  "legendFormat": "p99",
                  "refId": "B"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0,
                  "decimals": 3
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "id": 4,
              "type": "stat",
              "title": "Active sessions",
              "description": "Shared Redis session count. max() avoids multiplying the count by API replica count.",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "gridPos": {"h": 5, "w": 6, "x": 0, "y": 16},
              "targets": [{"expr": "max(sayangcare_redis_active_sessions)", "refId": "A"}],
              "fieldConfig": {
                "defaults": {"unit": "short", "min": 0},
                "overrides": []
              },
              "options": {
                "colorMode": "value",
                "graphMode": "none",
                "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
                "textMode": "value"
              }
            },
            {
              "id": 5,
              "type": "stat",
              "title": "Archive backlog",
              "description": "Sessions awaiting archival/recovery. Zero is normal when there is no pending work.",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "gridPos": {"h": 5, "w": 6, "x": 6, "y": 16},
              "targets": [{"expr": "max(sayangcare_archive_backlog)", "refId": "A"}],
              "fieldConfig": {
                "defaults": {"unit": "short", "min": 0},
                "overrides": []
              },
              "options": {
                "colorMode": "value",
                "graphMode": "none",
                "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
                "textMode": "value"
              }
            },
            {
              "id": 6,
              "type": "stat",
              "title": "Circuit breakers",
              "description": "Closed, Open, or Half-open state for each breaker.",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "gridPos": {"h": 5, "w": 6, "x": 12, "y": 16},
              "targets": [{
                "expr": "max by (breaker) (sayangcare_circuit_breaker_state)",
                "legendFormat": "{{breaker}}",
                "refId": "A"
              }],
              "fieldConfig": {
                "defaults": {
                  "mappings": [{
                    "type": "value",
                    "options": {
                      "0": {"text": "Closed", "color": "green"},
                      "1": {"text": "Open", "color": "red"},
                      "2": {"text": "Half-open", "color": "orange"}
                    }
                  }],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"color": "green", "value": null},
                      {"color": "orange", "value": 1},
                      {"color": "red", "value": 2}
                    ]
                  }
                },
                "overrides": []
              },
              "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "center",
                "orientation": "horizontal",
                "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
                "textMode": "value_and_name"
              }
            },
            {
              "id": 7,
              "type": "stat",
              "title": "API replicas",
              "description": "Discovered Prometheus API targets and targets currently scraping successfully.",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "gridPos": {"h": 5, "w": 6, "x": 18, "y": 16},
              "targets": [
                {
                  "expr": "count(up{namespace=\"sayangcare\",pod=~\"sayangcare-api-.*\"})",
                  "legendFormat": "discovered",
                  "refId": "A"
                },
                {
                  "expr": "sum(up{namespace=\"sayangcare\",pod=~\"sayangcare-api-.*\"})",
                  "legendFormat": "scrape healthy",
                  "refId": "B"
                }
              ],
              "fieldConfig": {
                "defaults": {"unit": "short", "min": 0},
                "overrides": []
              },
              "options": {
                "colorMode": "value",
                "graphMode": "none",
                "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
                "textMode": "value_and_name"
              }
            }
          ]
        }
