admin:
  existingSecret: grafana-admin

persistence:
  enabled: false

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Viewer
  users:
    viewers_can_edit: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: SayangCare
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    sayangcare-api:
      json: |
        {
          "id": null,
          "uid": "sayangcare-phase5",
          "title": "SayangCare API",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "5s",
          "time": {
            "from": "now-15m",
            "to": "now"
          },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "HTTP requests per second",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 9,
                "w": 12,
                "x": 0,
                "y": 0
              },
              "targets": [
                {
                  "expr": "sum(rate(sayangcare_http_requests_total[1m]))",
                  "legendFormat": "requests/s",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "HTTP requests per API pod",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 9,
                "w": 12,
                "x": 12,
                "y": 0
              },
              "targets": [
                {
                  "expr": "sum(rate(sayangcare_http_requests_total[2m])) by (pod)",
                  "legendFormat": "{{pod}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "reqps",
                  "min": 0
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "id": 3,
              "type": "stat",
              "title": "Total HTTP requests",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "h": 5,
                "w": 6,
                "x": 0,
                "y": 9
              },
              "targets": [
                {
                  "expr": "sum(sayangcare_http_requests_total)",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                },
                "overrides": []
              },
              "options": {
                "colorMode": "value",
                "graphMode": "area",
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ],
                  "fields": "",
                  "values": false
                },
                "textMode": "auto"
              }
            }
          ]
        }
