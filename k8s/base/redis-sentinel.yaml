########################################
# 1. Headless Service for Redis pods
########################################
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sayangcare
  labels: { app: redis }
spec:
  clusterIP: None
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
########################################
# 2. Redis StatefulSet (3 nodes)
########################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sayangcare
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      # Sentinel + Redis need to see each other on a shared network; default is fine.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: redis }
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              SELF_FQDN="${HOSTNAME}.redis.sayangcare.svc.cluster.local"
              SELF_IP="$(hostname -i | awk '{print $1}')"
              ORDINAL="${HOSTNAME##*-}"
              SENTINEL_HOST="redis-sentinel.sayangcare.svc.cluster.local"
              MASTER_NAME="sayangcare-master"

              # Ask Sentinel which node currently holds the master role. A pod that
              # restarts after a failover must rejoin as a replica of the promoted
              # node instead of coming back as a second master. Sentinel may still
              # be starting after a full-cluster restart, so retry briefly.
              MASTER_HOST=""
              MASTER_PORT="6379"
              for attempt in 1 2 3 4 5; do
                ADDR="$(redis-cli -h "$SENTINEL_HOST" -p 26379 SENTINEL get-master-addr-by-name "$MASTER_NAME" 2>/dev/null || true)"
                MASTER_HOST="$(printf '%s\n' "$ADDR" | sed -n '1p')"
                if [ -n "$MASTER_HOST" ]; then
                  MASTER_PORT="$(printf '%s\n' "$ADDR" | sed -n '2p')"
                  break
                fi
                sleep 2
              done

              if [ -z "$MASTER_HOST" ]; then
                # No Sentinel answer (first install): ordinal 0 bootstraps as master.
                if [ "$ORDINAL" = "0" ]; then
                  ROLE="master"
                else
                  ROLE="replica"
                  MASTER_HOST="redis-0.redis.sayangcare.svc.cluster.local"
                fi
              elif [ "$MASTER_HOST" = "$SELF_FQDN" ] || [ "$MASTER_HOST" = "$SELF_IP" ]; then
                ROLE="master"
              else
                ROLE="replica"
              fi
              echo "redis startup: pod=$HOSTNAME role=$ROLE master=${MASTER_HOST:-self}:$MASTER_PORT"

              # replica-announce-ip publishes the pod's stable DNS name to the master
              # and Sentinel, so topology tracking survives pod IP changes.
              if [ "$ROLE" = "master" ]; then
                exec redis-server \
                  --port 6379 \
                  --appendonly yes \
                  --save "" \
                  --protected-mode no \
                  --replica-announce-ip "$SELF_FQDN" \
                  --replica-announce-port 6379
              else
                exec redis-server \
                  --port 6379 \
                  --appendonly yes \
                  --save "" \
                  --protected-mode no \
                  --replica-announce-ip "$SELF_FQDN" \
                  --replica-announce-port 6379 \
                  --replicaof "$MASTER_HOST" "$MASTER_PORT"
              fi
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: sayangcare
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: redis }
---
########################################
# 3. Headless Service for Sentinels
########################################
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: sayangcare
  labels: { app: redis-sentinel }
spec:
  clusterIP: None
  selector: { app: redis-sentinel }
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
########################################
# 4. Sentinel StatefulSet (3 pods, quorum=2)
########################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: sayangcare
spec:
  serviceName: redis-sentinel
  replicas: 3
  selector:
    matchLabels: { app: redis-sentinel }
  template:
    metadata:
      labels: { app: redis-sentinel }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: redis-sentinel }
      # Sentinels must NOT be co-located with the Redis node they monitor,
      # but on a small cluster anti-affinity may not be satisfiable — soft it.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: redis }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: sentinel
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ ! -f /data/sentinel.conf ]; then
                cat > /data/sentinel.conf <<EOF
              port 26379
              dir /data
              sentinel resolve-hostnames yes
              sentinel announce-hostnames yes
              sentinel monitor sayangcare-master redis-0.redis.sayangcare.svc.cluster.local 6379 2
              sentinel down-after-milliseconds sayangcare-master 5000
              sentinel failover-timeout sayangcare-master 10000
              sentinel parallel-syncs sayangcare-master 1
              EOF
              fi
              exec redis-sentinel /data/sentinel.conf
          ports:
            - containerPort: 26379
              name: sentinel
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-sentinel-pdb
  namespace: sayangcare
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: redis-sentinel }
