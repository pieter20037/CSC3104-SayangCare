apiVersion: v1
kind: Service
metadata:
  name: sayangcare-api
  namespace: sayangcare
  labels: { app: sayangcare-api }
spec:
  type: ClusterIP
  selector: { app: sayangcare-api }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sayangcare-api
  namespace: sayangcare
  labels: { app: sayangcare-api }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Never drop below desired during rollout
  selector:
    matchLabels: { app: sayangcare-api }
  template:
    metadata:
      labels: { app: sayangcare-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      # Graceful shutdown: give in-flight calls time to drain before SIGKILL.
      terminationGracePeriodSeconds: 30
      # Spread replicas across nodes so a single node failure doesn't kill HA.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: sayangcare-api }
      # The API exits at bootstrap if Sentinel, the Redis master, or PostgreSQL
      # is unreachable (for example, DNS is still settling after a node restart).
      # Waiting here keeps pods in Init instead of a CrashLoopBackOff storm.
      initContainers:
        - name: wait-for-dependencies
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              SENTINEL="redis-sentinel.sayangcare.svc.cluster.local"
              until MASTER="$(redis-cli -h "$SENTINEL" -p 26379 SENTINEL get-master-addr-by-name sayangcare-master 2>/dev/null | sed -n '1p')" \
                    && [ -n "$MASTER" ] \
                    && [ "$(redis-cli -h "$MASTER" -p 6379 PING 2>/dev/null)" = "PONG" ]; do
                echo "waiting for Redis Sentinel and a reachable master"
                sleep 2
              done
              until nc -z -w 2 postgres.sayangcare.svc.cluster.local 5432; do
                echo "waiting for PostgreSQL"
                sleep 2
              done
              echo "dependencies reachable: redis master=$MASTER postgres=ok"
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "100m", memory: "64Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: api
          image: sayangcare-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SAYANGCARE__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sayangcare-secrets
                  key: POSTGRES_PASSWORD
            - name: SAYANGCARE__POSTGRES__URL
              value: "postgres://sayangcare:$(SAYANGCARE__POSTGRES__PASSWORD)@postgres.sayangcare.svc.cluster.local:5432/sayangcare"
            - name: SAYANGCARE__TELEPHONY__TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: sayangcare-secrets
                  key: SAYANGCARE__TELEPHONY__TWILIO_ACCOUNT_SID
            - name: SAYANGCARE__TELEPHONY__TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sayangcare-secrets
                  key: SAYANGCARE__TELEPHONY__TWILIO_AUTH_TOKEN
            # Optional keys: outbound caller ID and Groq inference. Omit them from
            # the Secret for simulator-only clusters; the API falls back safely.
            - name: SAYANGCARE__TELEPHONY__TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: sayangcare-secrets
                  key: SAYANGCARE__TELEPHONY__TWILIO_FROM_NUMBER
                  optional: true
            - name: SAYANGCARE__AI__API_KEY
              valueFrom:
                secretKeyRef:
                  name: sayangcare-secrets
                  key: SAYANGCARE__AI__API_KEY
                  optional: true
          envFrom:
            - configMapRef:
                name: sayangcare-config
          # Health endpoint is trivial (no DB call) — safe to probe frequently.
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          # Pre-stop: unregister from Service before shutdown so no new
          # sessions land on a pod that's about to die.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
# Never let voluntary disruptions (node drains, rollouts) drop below 2 pods.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sayangcare-api-pdb
  namespace: sayangcare
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: sayangcare-api }
