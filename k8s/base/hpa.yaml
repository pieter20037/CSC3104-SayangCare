apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sayangcare-api
  namespace: sayangcare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sayangcare-api
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: sayangcare_http_requests_per_second
        target:
          type: AverageValue
          averageValue: "25"
