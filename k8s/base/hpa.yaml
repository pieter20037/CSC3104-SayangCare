apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sayangcare-api
  namespace: sayangcare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sayangcare-api
  # 3 matches the Deployment's replica count and keeps the PDB (minAvailable: 2)
  # satisfiable with one voluntary disruption; 2 would block node drains.
  minReplicas: 3
  maxReplicas: 20
  behavior:
    # Scale up immediately on a spike (double, or +4 pods, per minute);
    # scale down slowly so brief lulls between calls don't churn pods.
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  # Resource metrics need only Metrics Server. The request-rate metric
  # (sayangcare_http_requests_per_second) lives in overlays/request-rate-hpa
  # because an unavailable custom metric prevents the HPA from scaling down.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
