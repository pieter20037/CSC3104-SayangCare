apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sayangcare-db
  namespace: sayangcare
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  failoverDelay: 0
  stopDelay: 90
  smartShutdownTimeout: 45
  bootstrap:
    initdb:
      database: sayangcare
      owner: sayangcare
      secret:
        name: sayangcare-db-app
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
