apiVersion: apps/v1
kind: Deployment
metadata:
  name: sayangcare-api
  namespace: sayangcare
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-dependencies
          args:
            - |
              SENTINEL="redis-sentinel.sayangcare.svc.cluster.local"
              until MASTER="$(redis-cli -h "$SENTINEL" -p 26379 SENTINEL get-master-addr-by-name sayangcare-master 2>/dev/null | sed -n '1p')" \
                    && [ -n "$MASTER" ] \
                    && [ "$(redis-cli -h "$MASTER" -p 6379 PING 2>/dev/null)" = "PONG" ]; do
                echo "waiting for Redis Sentinel and a reachable master"
                sleep 2
              done
              until nc -z -w 2 sayangcare-db-rw.sayangcare.svc.cluster.local 5432; do
                echo "waiting for the PostgreSQL primary service"
                sleep 2
              done
              echo "dependencies reachable: redis master=$MASTER postgres primary=ok"
      containers:
        - name: api
          env:
            - name: SAYANGCARE__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sayangcare-secrets
                  key: POSTGRES_PASSWORD
            - name: SAYANGCARE__POSTGRES__URL
              value: "postgres://sayangcare:$(SAYANGCARE__POSTGRES__PASSWORD)@sayangcare-db-rw.sayangcare.svc.cluster.local:5432/sayangcare"
