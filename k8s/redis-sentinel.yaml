########################################
# 1. Headless Service for Redis pods
########################################
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sayangcare
  labels: { app: redis }
spec:
  clusterIP: None
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
########################################
# 2. Redis StatefulSet (3 nodes)
########################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: sayangcare
spec:
  serviceName: redis
  replicas: 3
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      # Sentinel + Redis need to see each other on a shared network; default is fine.
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Extract ordinal from hostname (redis-0, redis-1, redis-2)
              ORDINAL=${HOSTNAME##*-}
              if [ "$ORDINAL" = "0" ]; then
                # Node 0 is the initial master
                exec redis-server \
                  --port 6379 \
                  --appendonly yes \
                  --save "" \
                  --protected-mode no
              else
                # Replicas follow the master's stable DNS name
                exec redis-server \
                  --port 6379 \
                  --appendonly yes \
                  --save "" \
                  --protected-mode no \
                  --replicaof redis-0.redis.sayangcare.svc.cluster.local 6379
              fi
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
########################################
# 3. Headless Service for Sentinels
########################################
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: sayangcare
  labels: { app: redis-sentinel }
spec:
  clusterIP: None
  selector: { app: redis-sentinel }
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
########################################
# 4. Sentinel StatefulSet (3 pods, quorum=2)
########################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: sayangcare
spec:
  serviceName: redis-sentinel
  replicas: 3
  selector:
    matchLabels: { app: redis-sentinel }
  template:
    metadata:
      labels: { app: redis-sentinel }
    spec:
      # Sentinels must NOT be co-located with the Redis node they monitor,
      # but on a small cluster anti-affinity may not be satisfiable — soft it.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: redis }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: sentinel
          image: redis:7-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Sentinel config is written fresh each boot so it can be
              # regenerated if the master changes.
              cat > /tmp/sentinel.conf <<EOF
              port 26379
              dir /tmp
              sentinel monitor sayangcare-master redis-0.redis.sayangcare.svc.cluster.local 6379 2
              sentinel down-after-milliseconds sayangcare-master 5000
              sentinel failover-timeout sayangcare-master 10000
              sentinel parallel-syncs sayangcare-master 1
              sentinel resolve-hostnames yes
              sentinel announce-hostnames yes
              EOF
              exec redis-sentinel /tmp/sentinel.conf
          ports:
            - containerPort: 26379
              name: sentinel
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }