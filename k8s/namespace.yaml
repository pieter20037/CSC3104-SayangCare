apiVersion: v1
kind: Namespace
metadata:
  name: sayangcare
  labels:
    # Enforce "restricted" pod security — good practice for a telehealth system.
    # Drop to "baseline" if your images need privileged features.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: sayangcare
---
# Shared ConfigMap for non-secret config.
# Shared non-secret settings; the API database URL is assembled from a Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sayangcare-config
  namespace: sayangcare
data:
  SAYANGCARE__SERVER__HOST: "0.0.0.0"
  SAYANGCARE__SERVER__PORT: "8080"
  SAYANGCARE__SERVER__WORKERS: "4"

  # Redis Sentinel (in-cluster DNS names)
  SAYANGCARE__REDIS__SENTINEL_ENDPOINTS: '["redis-sentinel-0.redis-sentinel.sayangcare.svc.cluster.local:26379","redis-sentinel-1.redis-sentinel.sayangcare.svc.cluster.local:26379","redis-sentinel-2.redis-sentinel.sayangcare.svc.cluster.local:26379"]'
  SAYANGCARE__REDIS__MASTER_NAME: "sayangcare-master"
  SAYANGCARE__REDIS__QUEUE_URL: "redis://redis-0.redis.sayangcare.svc.cluster.local:6379/"

  # Postgres URL is assembled in app-deployment.yaml from sayangcare-secrets.
  SAYANGCARE__POSTGRES__MAX_CONNECTIONS: "20"

  # Circuit breaker defaults
  SAYANGCARE__CIRCUIT_BREAKER__BASE_ERROR_RATE: "0.25"
  SAYANGCARE__CIRCUIT_BREAKER__BASE_LATENCY_MS: "2000"
  SAYANGCARE__CIRCUIT_BREAKER__MIN_REQUESTS: "20"
  SAYANGCARE__CIRCUIT_BREAKER__HALF_OPEN_AFTER_SECS: "10"

  # Telephony (non-secret bits)
  SAYANGCARE__TELEPHONY__PUBLIC_BASE_URL: "https://sayangcare.example.com"

  RUST_LOG: "info,sayangcare=debug,actix_web=info"
