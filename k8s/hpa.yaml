apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sayangcare-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sayangcare-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Pods
      pods:
        metric:
          name: active_voice_sessions
        target:
          type: AverageValue
          averageValue: "50"