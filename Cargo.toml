[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/session-store",
    "crates/circuit-breaker",
    "crates/priority-queue",
    "crates/telephony",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Team 25 - SIT CSC3104"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

# Web framework
actix-web = "4.9"
actix-ws = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Storage
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "sentinel"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid", "migrate"] }
openraft = { version = "0.9.25", features = ["serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
dotenvy = "0.15"

# Internal crates
sayangcare-core = { path = "crates/core" }
sayangcare-session-store = { path = "crates/session-store" }
sayangcare-circuit-breaker = { path = "crates/circuit-breaker" }
sayangcare-priority-queue = { path = "crates/priority-queue" }
sayangcare-telephony = { path = "crates/telephony" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3